name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install runtime system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - name: Run unit tests
        run: bun test ./packages/*/test

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install runtime system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install runtime system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - run: bun install
      - name: Run E2E tests
        run: bun run test:e2e

  release-runtime-bundle:
    name: Release runtime bundle (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Build the release runtime bundle
        shell: bash
        run: |
          bun run overdare-ai-agent:build-runtime-bundle -- \
            --version "ci-${{ github.run_id }}" \
            --platform windows-x64 \
            --agent-env dev
      - name: Verify the packaged sidecar starts and serves its client
        shell: pwsh
        run: |
          $version = "ci-${{ github.run_id }}"
          $archive = "dist/overdare-ai-agent-runtime-dev-$version-windows-x64.zip"
          $bundle = Join-Path $env:RUNNER_TEMP "overdare-runtime-bundle"
          $runtimeCwd = Join-Path $env:RUNNER_TEMP "overdare-runtime-smoke"
          $stdout = Join-Path $env:RUNNER_TEMP "overdare-runtime-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "overdare-runtime-stderr.log"

          Expand-Archive -LiteralPath $archive -DestinationPath $bundle -Force
          $requiredPaths = @(
            "diligent-web-server.exe",
            "dist/client/index.html",
            "assets/bin/luau-lsp.exe",
            "assets/bin/luau.exe",
            "defaults/config.jsonc"
          )
          foreach ($relativePath in $requiredPaths) {
            if (-not (Test-Path (Join-Path $bundle $relativePath))) {
              throw "Runtime bundle is missing $relativePath"
            }
          }

          New-Item -ItemType Directory -Path $runtimeCwd -Force | Out-Null
          $process = Start-Process `
            -FilePath (Join-Path $bundle "diligent-web-server.exe") `
            -ArgumentList "--port=7434", "--cwd=$runtimeCwd" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:7434/health" -TimeoutSec 1
                if ($health.ok -eq $true) {
                  $client = Invoke-WebRequest "http://127.0.0.1:7434/" -TimeoutSec 1
                  if ($client.Content -notmatch "<div id=\"root\">") {
                    throw "Packaged sidecar did not serve the Vite client"
                  }
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $healthy) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Packaged diligent-web-server.exe did not become healthy"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
