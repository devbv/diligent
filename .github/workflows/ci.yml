name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install runtime system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - name: Run unit tests
        run: bun test ./packages/*/test

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install runtime system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install runtime system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - run: bun install
      - name: Run E2E tests
        run: bun run test:e2e
