name: External Agent E2E

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Harbor dataset name and optional version"
        required: true
        type: string
        default: "terminal-bench@2.0"
      task_filter:
        description: "Optional Harbor task-name glob"
        required: false
        type: string
        default: "regex-log"
      model:
        description: "Diligent model in provider/model form"
        required: true
        type: string
        default: "anthropic/claude-sonnet-5"
      n_tasks:
        description: "Maximum number of tasks after filtering"
        required: true
        type: number
        default: 1
      timeout_multiplier:
        description: "Harbor task timeout multiplier"
        required: true
        type: number
        default: 1

concurrency:
  group: ${{ github.repository }}-external-agent-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harbor-e2e:
    name: Diligent on ${{ inputs.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      HARBOR_DATASET: ${{ inputs.dataset }}
      HARBOR_TASK_FILTER: ${{ inputs.task_filter }}
      HARBOR_MODEL: ${{ inputs.model }}
      HARBOR_N_TASKS: ${{ inputs.n_tasks }}
      HARBOR_TIMEOUT_MULTIPLIER: ${{ inputs.timeout_multiplier }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: thirdparty/terminal-bench/pyproject.toml
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Build packaged Linux CLI
        run: bun run build:linux-x64
      - name: Install Harbor adapter
        run: |
          python -m venv .harbor-venv
          .harbor-venv/bin/pip install -e thirdparty/terminal-bench
      - name: Run external E2E
        shell: bash
        run: |
          args=(
            run
            --yes
            --dataset "$HARBOR_DATASET"
            --agent diligent_tbench:DiligentAgent
            --model "$HARBOR_MODEL"
            --n-concurrent 1
            --n-tasks "$HARBOR_N_TASKS"
            --timeout-multiplier "$HARBOR_TIMEOUT_MULTIPLIER"
            --jobs-dir artifacts/harbor
          )
          if [ -n "$HARBOR_TASK_FILTER" ]; then
            args+=(--include-task-name "$HARBOR_TASK_FILTER")
          fi
          .harbor-venv/bin/harbor "${args[@]}"
      - name: Upload Harbor job artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/harbor
          if-no-files-found: warn
          retention-days: 30
