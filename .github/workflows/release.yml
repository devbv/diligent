name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New release version, e.g. 1.0.0 — REQUIRED when running from main (minting a new version). LEAVE BLANK when running from a release tag; the version is taken from the tag name."
        required: false
        type: string
      env:
        description: "Release env (prod or dev)"
        required: true
        type: choice
        options:
          - prod
          - dev
        default: prod

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      env: ${{ steps.resolve.outputs.env }}
      tag: ${{ steps.resolve.outputs.tag }}
      release_exists: ${{ steps.check_release.outputs.release_exists }}

    steps:
      - name: Resolve version and env
        id: resolve
        shell: bash
        env:
          # Pass user/context inputs through env (not inline ${{ }}) to avoid
          # shell injection from the free-text version field.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_ENV: ${{ inputs.env }}
        run: |
          case "$RELEASE_ENV" in
            prod|dev) ;;
            *)
              echo "Invalid env '$RELEASE_ENV' (expected prod or dev)" >&2
              exit 1
              ;;
          esac

          # Normalize an optional leading 'v' on the typed version.
          INPUT_VERSION="${INPUT_VERSION#v}"

          if [ "$REF_TYPE" = "tag" ]; then
            # Tag mode = re-deploy / cross-env. The version is DEFINED by the tag,
            # never by free-text, so code and version can't diverge. Release tags
            # are named "<env>-v<version>" (e.g. prod-v0.4.1); derive the version.
            if [[ "$REF_NAME" =~ ^(prod|dev)-v(.+)$ ]]; then
              VERSION="${BASH_REMATCH[2]}"
            else
              echo "Dispatched from tag '$REF_NAME', which is not a release tag (expected <prod|dev>-v<version>, e.g. prod-v0.4.1). Pick a release tag, or run from main with a version input to mint a new version." >&2
              exit 1
            fi
            # A version typed in tag mode is ambiguous — only allow it if it agrees.
            if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$VERSION" ]; then
              echo "Version input '$INPUT_VERSION' conflicts with tag '$REF_NAME' (version '$VERSION'). Leave the version blank when dispatching from a release tag." >&2
              exit 1
            fi
            echo "Tag mode: building the commit at '$REF_NAME' as version '$VERSION' for env '$RELEASE_ENV'."
          else
            # Branch mode = a new version is born here (from main HEAD). This is the
            # ONLY place free-text is allowed, and it can't mismatch: the version you
            # type is the declaration that this commit IS that version.
            if [ -z "$INPUT_VERSION" ]; then
              echo "Running from branch '$REF_NAME' requires a 'version' input — new versions are typed once, here. (To re-deploy or cross-deploy an existing version, run from its release tag instead.)" >&2
              exit 1
            fi
            VERSION="$INPUT_VERSION"
            echo "Branch mode: minting new version '$VERSION' from '$REF_NAME' (HEAD) for env '$RELEASE_ENV'."
          fi

          TAG="${RELEASE_ENV}-v${VERSION}"
          {
            echo "version=$VERSION"
            echo "env=$RELEASE_ENV"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Packaging version: $VERSION (env=$RELEASE_ENV, tag=$TAG)"

      - name: Check existing GitHub Release
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists for $TAG. Skipping build/publish jobs."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "No release exists for $TAG. Continuing."
          fi

  build-overdare-runtime-bundle-windows-x64:
    name: Build OVERDARE runtime bundle (Windows x64)
    needs: prepare
    if: ${{ needs.prepare.outputs.release_exists != 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ENV: ${{ needs.prepare.outputs.env }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build runtime bundle
        shell: bash
        run: |
          bun run overdare-ai-agent:build-runtime-bundle -- \
            --version "$VERSION" \
            --platform windows-x64 \
            --agent-env "$RELEASE_ENV"

      - name: Upload runtime bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: overdare-runtime-${{ env.RELEASE_ENV }}-windows-x64-${{ env.VERSION }}
          path: |
            dist/overdare-ai-agent-runtime-${{ env.RELEASE_ENV }}-${{ env.VERSION }}-windows-x64.zip

  build-linux-cli-x64:
    name: Diligent Linux x64 CLI
    needs: prepare
    if: ${{ needs.prepare.outputs.release_exists != 'true' && needs.prepare.outputs.env == 'prod' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build Linux x64 CLI binary
        shell: bash
        run: |
          bun run build:linux-x64
          mv dist/diligent-linux-x64 "dist/diligent-${VERSION}-linux-x64"

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: diligent-linux-x64-${{ env.VERSION }}
          path: dist/diligent-${{ env.VERSION }}-linux-x64

  build-overdare-ai-agent-windows-x64:
    name: OVERDARE CLI Windows x64
    needs: prepare
    if: ${{ needs.prepare.outputs.release_exists != 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ENV: ${{ needs.prepare.outputs.env }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows x64 OVERDARE CLI binary
        shell: bash
        run: |
          cargo build --manifest-path apps/overdare-ai-agent/Cargo.toml --release
          mkdir -p dist
          cp apps/overdare-ai-agent/target/release/overdare-ai-agent.exe \
             "dist/overdare-ai-agent-${RELEASE_ENV}-${VERSION}-windows-x64.exe"

      - name: Upload OVERDARE CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: overdare-ai-agent-${{ env.RELEASE_ENV }}-windows-x64-${{ env.VERSION }}
          path: dist/overdare-ai-agent-${{ env.RELEASE_ENV }}-${{ env.VERSION }}-windows-x64.exe

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build-overdare-runtime-bundle-windows-x64
      - build-linux-cli-x64
      - build-overdare-ai-agent-windows-x64
    if: |
      always() &&
      needs.prepare.outputs.release_exists != 'true' &&
      needs.build-overdare-runtime-bundle-windows-x64.result == 'success' &&
      needs.build-overdare-ai-agent-windows-x64.result == 'success' &&
      (needs.build-linux-cli-x64.result == 'success' || needs.build-linux-cli-x64.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ENV: ${{ needs.prepare.outputs.env }}
      TAG: ${{ needs.prepare.outputs.tag }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows runtime bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: overdare-runtime-${{ env.RELEASE_ENV }}-windows-x64-${{ env.VERSION }}
          path: release-artifacts/runtime-windows-x64

      - name: Download Linux x64 CLI artifact
        if: ${{ env.RELEASE_ENV == 'prod' }}
        uses: actions/download-artifact@v4
        with:
          name: diligent-linux-x64-${{ env.VERSION }}
          path: release-artifacts/linux-x64

      - name: Download OVERDARE CLI Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: overdare-ai-agent-${{ env.RELEASE_ENV }}-windows-x64-${{ env.VERSION }}
          path: release-artifacts/overdare-ai-agent-windows-x64

      - name: Assemble release files
        shell: bash
        run: |
          mkdir -p dist
          cp -R release-artifacts/runtime-windows-x64/. dist/
          cp -R release-artifacts/overdare-ai-agent-windows-x64/. dist/
          if [ "$RELEASE_ENV" = "prod" ]; then
            cp -R release-artifacts/linux-x64/. dist/
          fi

      - name: Generate merged metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["VERSION"]
          release_env = os.environ["RELEASE_ENV"]
          tag = os.environ["TAG"]
          repository = os.environ["REPOSITORY"]
          dist = Path("dist")

          runtime_bundle_windows = dist / f"overdare-ai-agent-runtime-{release_env}-{version}-windows-x64.zip"
          overdare_cli_windows = dist / f"overdare-ai-agent-{release_env}-{version}-windows-x64.exe"
          linux_cli = dist / f"diligent-{version}-linux-x64"

          required = [runtime_bundle_windows, overdare_cli_windows]
          if release_env == "prod":
              required.append(linux_cli)
          for path in required:
              if not path.exists():
                  raise SystemExit(f"Required release artifact missing: {path}")

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          artifacts: dict[str, list[str]] = {}
          if runtime_bundle_windows.exists():
              artifacts["windows-x64-runtime"] = [runtime_bundle_windows.name]
          if overdare_cli_windows.exists():
              artifacts[f"overdare-ai-agent-{release_env}-windows-x64"] = [overdare_cli_windows.name]
          if linux_cli.exists():
              artifacts["linux-x64"] = [linux_cli.name]

          release_date = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          platforms: dict[str, dict] = {}
          if runtime_bundle_windows.exists():
              platforms["windows-x64"] = {
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{runtime_bundle_windows.name}",
                  "sha256": sha256(runtime_bundle_windows),
                  "size": runtime_bundle_windows.stat().st_size,
              }

          manifest = {
              "version": version,
              "env": release_env,
              "releaseDate": release_date,
              "platforms": platforms,
          }
          manifest_path = dist / f"update-manifest-{release_env}.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          git_commit = os.popen("git rev-parse --short HEAD").read().strip() or "unknown"
          release_meta = {
              "version": version,
              "env": release_env,
              "tag": tag,
              "buildDate": release_date,
              "gitCommit": git_commit,
              "platforms": list(artifacts.keys()),
              "artifacts": artifacts,
          }
          (dist / f"release-meta-{release_env}.json").write_text(
              json.dumps(release_meta, indent=2) + "\n"
          )

          excluded = {
              f"checksums-{release_env}.sha256",
              f"release-meta-{release_env}.json",
              # legacy aliases — written later, must not feed back into checksums
              "checksums.sha256",
              "release-meta.json",
              "update-manifest.json",
          }
          checksum_files = sorted(
              path
              for path in dist.iterdir()
              if path.is_file() and path.name not in excluded
          )
          checksum_lines = [f"{sha256(path)}  {path.name}" for path in checksum_files]
          (dist / f"checksums-{release_env}.sha256").write_text("\n".join(checksum_lines) + "\n")

          if release_env == "prod":
              # Migration-window legacy aliases for old agents (pre-PR1) that fetch
              # update-manifest.json / release-meta.json / checksums.sha256 without env suffix.
              (dist / "update-manifest.json").write_bytes(manifest_path.read_bytes())
              (dist / "release-meta.json").write_bytes(
                  (dist / f"release-meta-{release_env}.json").read_bytes()
              )
              (dist / "checksums.sha256").write_bytes(
                  (dist / f"checksums-{release_env}.sha256").read_bytes()
              )
          PY

      - name: Create GitHub Release (prod)
        if: ${{ env.RELEASE_ENV == 'prod' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$TAG" \
            dist/overdare-ai-agent-runtime-"$RELEASE_ENV"-"$VERSION"-windows-x64.zip \
            dist/overdare-ai-agent-"$RELEASE_ENV"-"$VERSION"-windows-x64.exe \
            dist/diligent-"$VERSION"-linux-x64 \
            dist/update-manifest-"$RELEASE_ENV".json \
            dist/release-meta-"$RELEASE_ENV".json \
            dist/checksums-"$RELEASE_ENV".sha256 \
            dist/update-manifest.json \
            dist/release-meta.json \
            dist/checksums.sha256 \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --draft

      - name: Create GitHub Release (dev)
        if: ${{ env.RELEASE_ENV == 'dev' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$TAG" \
            dist/overdare-ai-agent-runtime-"$RELEASE_ENV"-"$VERSION"-windows-x64.zip \
            dist/overdare-ai-agent-"$RELEASE_ENV"-"$VERSION"-windows-x64.exe \
            dist/update-manifest-"$RELEASE_ENV".json \
            dist/release-meta-"$RELEASE_ENV".json \
            dist/checksums-"$RELEASE_ENV".sha256 \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --prerelease

      - name: Refresh dev-latest rolling release
        if: ${{ env.RELEASE_ENV == 'dev' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Atomically replace the rolling pointer. The previous `|| true` was
          # masking real failures (auth blips, tag-cleanup races) and could
          # leave the rolling tag stuck on the previous version.
          if gh release view dev-latest --json id >/dev/null 2>&1; then
            if ! gh release delete dev-latest -y --cleanup-tag; then
              echo "Failed to delete the previous dev-latest release; investigate before retrying — leaving the rolling tag untouched is safer than overwriting it half-deleted." >&2
              exit 1
            fi
          else
            echo "No existing dev-latest release; creating fresh."
          fi

          gh release create dev-latest \
            dist/overdare-ai-agent-runtime-"$RELEASE_ENV"-"$VERSION"-windows-x64.zip \
            dist/overdare-ai-agent-"$RELEASE_ENV"-"$VERSION"-windows-x64.exe \
            dist/update-manifest-"$RELEASE_ENV".json \
            dist/release-meta-"$RELEASE_ENV".json \
            dist/checksums-"$RELEASE_ENV".sha256 \
            --title "dev-latest (pointer to $TAG)" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes "Rolling pointer to the latest dev release. Use $TAG for an immutable reference."

      - name: Verify dev releases are marked as prerelease
        if: ${{ env.RELEASE_ENV == 'dev' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for r in "$TAG" dev-latest; do
            is_pre=$(gh release view "$r" --json isPrerelease --jq '.isPrerelease')
            if [ "$is_pre" != "true" ]; then
              echo "Release '$r' is not marked as prerelease (got '$is_pre'). Aborting to avoid polluting prod 'latest'." >&2
              exit 1
            fi
          done

      - name: Verify prod release state and announce manual publish
        if: ${{ env.RELEASE_ENV == 'prod' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          state=$(gh release view "$TAG" --json isPrerelease,isDraft --jq '{p: .isPrerelease, d: .isDraft}')
          is_pre=$(echo "$state" | jq -r '.p')
          is_draft=$(echo "$state" | jq -r '.d')
          if [ "$is_pre" != "false" ]; then
            echo "Release '$TAG' is unexpectedly marked as prerelease (got '$is_pre'). prod releases must not be prerelease — GitHub's 'latest' redirect would skip this release." >&2
            exit 1
          fi
          if [ "$is_draft" != "true" ]; then
            echo "Release '$TAG' is no longer in draft state (got isDraft='$is_draft'). prod releases must stay in draft until a human reviews and publishes — otherwise the change ships without manual approval." >&2
            exit 1
          fi
          echo "::warning title=Manual publish required::Prod release '$TAG' is published as a DRAFT. Manually publish it via the GitHub Releases UI to make it available at /releases/latest/. Until then, prod-latest agents continue to fetch the previously published release."

      - name: Upload merged release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: overdare-release-metadata-${{ env.RELEASE_ENV }}-${{ env.VERSION }}
          path: |
            dist/update-manifest-${{ env.RELEASE_ENV }}.json
            dist/release-meta-${{ env.RELEASE_ENV }}.json
            dist/checksums-${{ env.RELEASE_ENV }}.sha256
