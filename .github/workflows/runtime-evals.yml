name: Runtime Evals

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider filter; all runs both providers"
        required: true
        type: choice
        options: [all, openai, anthropic]
        default: all
      task:
        description: "Optional task ID; empty runs every runtime task"
        required: false
        type: string
      model:
        description: "Optional model override"
        required: false
        type: string
      seed:
        description: "Optional recorded root seed"
        required: false
        type: string
  schedule:
    - cron: "30 21 * * *"
  workflow_call:
    inputs:
      artifact_retention_days:
        required: false
        type: number
        default: 90
    secrets:
      OPENAI_API_KEY:
        required: true
      ANTHROPIC_API_KEY:
        required: true

concurrency:
  group: ${{ github.repository }}-model-evals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runtime-evals:
    name: Runtime eval suite (shadow, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_PROVIDER: ${{ inputs.provider || 'all' }}
      EVAL_TASK: ${{ inputs.task || '' }}
      EVAL_MODEL: ${{ inputs.model || '' }}
      EVAL_SEED: ${{ inputs.seed || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install runtime system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install runtime system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - run: bun install --frozen-lockfile
      - name: Run runtime eval suite
        shell: bash
        run: |
          args=(runtime)
          if [ "$EVAL_PROVIDER" != "all" ]; then args+=(--provider "$EVAL_PROVIDER"); fi
          if [ -n "$EVAL_TASK" ]; then args+=(--task "$EVAL_TASK"); fi
          if [ -n "$EVAL_MODEL" ]; then args+=(--model "$EVAL_MODEL"); fi
          if [ -n "$EVAL_SEED" ]; then args+=(--seed "$EVAL_SEED"); fi
          bun run eval "${args[@]}"
      - name: Upload runtime eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evals-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evals/runtime-*.json
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days || 30 }}
